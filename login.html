
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Login</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #17152f, #49318b, #7865c9);
      padding: 20px;
    }

    .login-box {
      background: white;
      width: 100%;
      max-width: 390px;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 15px 40px #0003;
    }

    .logo {
      text-align: center;
      font-size: 45px;
    }

    h2 {
      text-align: center;
      color: #34246b;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background: #5b42b4;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover { background: #392576; }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .hint {
      font-size: 12px;
      color: #777;
      text-align: center;
      margin-top: 20px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">📚</div>
    <h2>Library Management</h2>
    <p class="subtitle">Welcome back!</p>

    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" type="text" placeholder="Enter username" required>

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Enter password" required>

      <label style="font-weight:normal;font-size:14px;">
        <input id="showPassword" type="checkbox" style="width:auto;">
        Show password
      </label>

      <button type="submit">Login →</button>
      <p id="message" role="status"></p>
    </form>

    <p class="hint">
      Student Library Management System<br>
      Demo login for project preview
    </p>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const password = document.getElementById("password");
    const message = document.getElementById("message");

    document.getElementById("showPassword").addEventListener("change", function () {
      password.type = this.checked ? "text" : "password";
    });

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();

      if (username && password.value) {
        message.style.color = "#16865c";
        message.textContent = "Demo login successful! Opening library...";

        setTimeout(function () {
          window.location.href = "index.html";
        }, 700);
      }
    });
  </script>
</body>
</html>
